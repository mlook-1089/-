<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>حلقة ابن كثير - منصة رصد</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1b30'/%3E%3Cpath d='M32 18v28M32 18c-3.1-2-7.3-3.3-11.6-3.3S12.4 16 9.3 18v28c3.1-2 7.3-3.3 11.6-3.3S28.9 44 32 46m0-28c3.1-2 7.3-3.3 11.6-3.3S51.6 16 54.7 18v28c-3.1-2-7.3-3.3-11.6-3.3S35.1 44 32 46' fill='none' stroke='%23d4af37' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<meta name="mobile-web-app-capable" content="yes">

<!-- الخطوط والمكتبات -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<!-- Tailwind مبني مسبقاً (npm run build:css) بدل CDN الذي كان يبني الأنماط على جهاز المستخدم.
     Chart.js وxlsx تُحمَّلان عند الحاجة فقط (ensureLib) — الطالب وولي الأمر لا يحتاجانهما. -->
<link rel="stylesheet" href="/tw.css?v=6">

<style>
* { -webkit-tap-highlight-color: transparent; }
body { background-color: #f4f7fa; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
.transition-all-fast { transition: all 0.2s ease-in-out; }

/* Utilities from original */
.spinner{width:38px;height:38px;border:3px solid rgba(212,175,55,.2);border-top-color:#d4af37;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fade .3s cubic-bezier(.2,.7,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.slide-up{animation:sup .35s cubic-bezier(.2,.7,.3,1)}
@keyframes sup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-bg{background:rgba(2,6,23,.6);backdrop-filter:blur(8px)}

/* Forms & Inputs */
input, select, textarea { transition: all .18s; }
.input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1.5px solid #e2e8f0; background: #fff; font-size: 14px; outline: none; }
.input:focus { border-color: #0d1b30; box-shadow: 0 0 0 3px rgba(13,27,48,.1); }

/* Buttons & Chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 12px; font-weight: 700; transition: all .18s; cursor: pointer; user-select: none; }
.btn:active { transform: scale(.97); }
.btn-primary { background: #0d1b30; color: #fff; }
.btn-primary:hover { background: #102a43; box-shadow: 0 6px 20px -4px rgba(13,27,48,.4); }
.btn-accent { background: #d4af37; color: #0f172a; }
.btn-ghost { background: #f1f5f9; color: #334155; }
.btn-ghost:hover { background: #e2e8f0; }
.btn-red { background: #fee2e2; color: #991b1b; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }

/* Status & Attendance Toggle Buttons */
.status-btn { padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 700; text-align: center; transition: all .18s; border: 2px solid transparent; cursor: pointer; }
.status-btn.on-done { background: #d1fae5; color: #065f46; border-color: #10b981; }
.status-btn.on-partial { background: #fef3c7; color: #92400e; border-color: #d4af37; }
.status-btn.on-missed { background: #fee2e2; color: #991b1b; border-color: #ef4444; }
.status-btn.off { background: #f8fafc; color: #94a3b8; border-color: #e2e8f0; }

.att-chip { flex: 1; padding: 10px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all .18s; border: 2px solid transparent; text-align: center; background: #f8fafc; color: #64748b; }
.att-chip.on-present { background: #d1fae5; color: #065f46; border-color: #10b981; }
.att-chip.on-late { background: #fef3c7; color: #92400e; border-color: #d4af37; }
.att-chip.on-absent { background: #fee2e2; color: #991b1b; border-color: #ef4444; }

/* Custom Login BG */
.islamic-pattern-bg { background-color: #0d1b30; background-image: radial-gradient(#d4af37 0.5px, transparent 0.5px), radial-gradient(#d4af37 0.5px, #0d1b30 0.5px); background-size: 40px 40px; background-position: 0 0, 20px 20px; background-attachment: fixed; opacity: 0.98; }

/* Print Styles — التقارير تُطبع من صفحة الخادم؛ هنا نخفي فقط عناصر التنقل */
@media print {
  #sidebar, header, .no-print, #mobile-overlay { display: none !important; }
  .flex-1.md\:mr-64 { margin-right: 0 !important; }
  body { overflow: visible !important; height: auto !important; }
}

/* الأسماء الكاملة — منع القص افتراضياً */
.name-full { white-space: normal !important; overflow-wrap: anywhere; word-break: break-word; line-height: 1.35; }

/* الجوال: خط الحقول 16px على الأقل وإلا كبّر Safari الصفحة عند النقر على أي حقل */
@media (max-width: 767px) {
  .input, .nz-mini-input, input, select, textarea { font-size: 16px !important; }
}
/* ارتفاع الشاشة الفعلي على الجوال (100vh يتجاهل شريط العنوان فيُقص أسفل الصفحة) */
.h-screen { height: 100vh; height: 100dvh; }
.min-h-screen { min-height: 100vh; min-height: 100dvh; }
/* المساحة الآمنة (شريط الإيماءات في آيفون) */
main#portal { padding-bottom: calc(1rem + env(safe-area-inset-bottom)) !important; }
.modal-v4, #modal > div { padding-bottom: calc(1.15rem + env(safe-area-inset-bottom)); }
#toastBox { margin-bottom: env(safe-area-inset-bottom); }

/* تحسينات الجوال */
@media (max-width: 640px) {
  /* السماح للنصوص المهمة بالنزول لأكثر من سطر */
  .truncate-mobile-off { white-space: normal !important; overflow: visible !important; text-overflow: clip !important; }
  main#portal { padding: 12px !important; }
  h1.text-2xl { font-size: 1.25rem !important; line-height: 1.4; }
  .btn { padding: 9px 12px; font-size: 13px; }
  .input { padding: 10px 12px; font-size: 14px; }
  .chip { font-size: 10.5px; padding: 3px 8px; }
  /* بطاقات إحصائية على الجوال — نصوص أصغر */
  .stat-mobile p.text-2xl { font-size: 1.4rem; }
}

/* بطاقة طالب المتابعة — تصميم نموذجي */
.nz-card { background: #fff; border-radius: 18px; box-shadow: 0 2px 12px -6px rgba(2,6,23,.1); border: 1px solid #f1f5f9; overflow: hidden; transition: box-shadow .2s, transform .2s; }
.nz-card:hover { box-shadow: 0 8px 24px -8px rgba(2,6,23,.15); }
.nz-avatar { background: linear-gradient(135deg,#0d1b30 0%,#102a43 100%); color: #d4af37; font-weight: 800; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; box-shadow: 0 2px 8px -2px rgba(13,27,48,.3); }
.nz-progress-track { background: #f1f5f9; height: 6px; border-radius: 999px; overflow: hidden; }
.nz-progress-fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
.nz-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px; margin-bottom: 8px; }
.nz-item.done { background: linear-gradient(180deg,#f0fdf4 0%,#ecfdf5 100%); border-color: #86efac; }
.nz-item.blocked { background: #fef2f2; border-color: #fecaca; }
.nz-item.editing { background: #fff; border-color: #cbd5e1; }
.nz-field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 10px; }
@media (min-width: 768px) { .nz-field-grid { grid-template-columns: repeat(6, 1fr); gap: 8px; } .nz-field-grid .col-sur { grid-column: span 3; } .nz-field-grid .col-att { grid-column: span 2; } .nz-field-grid .col-save { grid-column: span 6; } }
.nz-field-grid .col-sur { grid-column: span 2; }
.nz-field-grid .col-att { grid-column: span 2; }
.nz-field-grid .col-save { grid-column: span 2; }
.nz-mini-input { padding: 8px 10px; font-size: 13px; border-radius: 10px; border: 1.5px solid #e2e8f0; background: #fff; outline: none; width: 100%; text-align: center; font-weight: 700; }
.nz-mini-input:focus { border-color: #0d1b30; box-shadow: 0 0 0 3px rgba(13,27,48,.08); }
.nz-mini-label { font-size: 10px; font-weight: 700; color: #64748b; margin-bottom: 4px; display: block; text-align: center; }

/* منافسة المجموعات */
.gc-card { background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 4px 16px -6px rgba(2,6,23,.08); border: 1px solid #f1f5f9; }
.gc-bar { height: 10px; background: #f1f5f9; border-radius: 999px; overflow: hidden; }
.gc-bar-fill { height: 100%; background: linear-gradient(90deg,#d4af37 0%,#e6c05a 100%); border-radius: 999px; transition: width .6s ease; }
.gc-rank-1 { background: linear-gradient(135deg,#fef3c7 0%,#fde68a 100%); border: 1.5px solid #fbbf24; }
.gc-rank-2 { background: linear-gradient(135deg,#f1f5f9 0%,#e2e8f0 100%); border: 1.5px solid #cbd5e1; }
.gc-rank-3 { background: linear-gradient(135deg,#fef2e8 0%,#fed7aa 100%); border: 1.5px solid #fb923c; }


/* =====================================================================
   الهوية البصرية v4 — على طراز منصة التداول
   طبقة تُضاف فوق المكدس التاريخي. نعتمد الكحلي #013856 كلون رئيسي
   والأخضر #1B7F4B للنجاح والأحمر #B03038 للفشل، خط IBM Plex Sans Arabic
   للنصوص وTajawal للعناوين، وبطاقات بيضاء rounded-3xl على خلفية #EFF3F7.
   ===================================================================== */
body { background-color: #EFF3F7 !important; font-family: 'IBM Plex Sans Arabic', 'Tajawal', sans-serif !important; }
html, body { overflow-x: hidden !important; max-width: 100vw; }
* { min-width: 0; }
.num, .tabular-nums { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }

/* بطاقات — الطراز التداولي */
.card-v4 { background:#fff; border:1px solid #E2E8F0; border-radius:1.5rem; box-shadow:0 2px 10px rgba(1,56,86,0.05); padding:1.25rem; }
@media (min-width:768px){ .card-v4 { padding:1.5rem; } }

/* عنوان قسم بأيقونة داخل مربّع ملوّن — نمط trading */
.sec-head-v4 { display:flex; align-items:center; gap:.5rem; margin-bottom:1rem; }
.sec-head-v4 h2, .sec-head-v4 h3 { font-family:'Tajawal'; font-weight:700; color:#1E293B; font-size:1.125rem; margin:0; }
.sec-icon-badge { width:2rem; height:2rem; border-radius:.5rem; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.sec-icon-badge.brand { background: rgba(1,56,86,.1); color: #013856; }
.sec-icon-badge.gold  { background: #FEF3C7; color: #B45309; }
.sec-icon-badge.pass  { background: #E2F0E8; color: #1B7F4B; }
.sec-icon-badge.fail  { background: #F8E5E6; color: #B03038; }
.sec-icon-badge.sky   { background: #E0F2FE; color: #0369A1; }
.sec-icon-badge.violet{ background: #EDE9FE; color: #6D28D9; }
.sec-icon-badge.rose  { background: #FCE7F3; color: #BE185D; }

/* رقاقات الحالة (مفتوح/مغلق مثل trading) */
.pill-v4 { display:inline-flex; align-items:center; gap:.35rem; padding:.25rem .75rem; border-radius:9999px; font-size:.72rem; font-weight:700; border:1px solid transparent; }
.pill-v4::before { content:''; width:.4rem; height:.4rem; border-radius:50%; background: currentColor; }
.pill-v4.ok { background:#E2F0E8; color:#1B7F4B; border-color:#1B7F4B; }
.pill-v4.err { background:#F8E5E6; color:#B03038; border-color:#B03038; }
.pill-v4.info { background:#DBEAFE; color:#1D4ED8; border-color:#93C5FD; }
.pill-v4.gold { background:#FEF3C7; color:#B45309; border-color:#FBBF24; }

/* أزرار الهوية الجديدة (نبقي .btn القديم للتوافق) */
.btn-v4 { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; padding:.75rem 1rem; border-radius:.75rem; font-weight:700; font-size:.9rem; transition:all .15s; cursor:pointer; border:none; font-family:inherit; }
.btn-v4:active { transform: scale(.97); }
.btn-v4-primary { background:#013856; color:#fff; box-shadow:0 4px 12px -3px rgba(1,56,86,.3); }
.btn-v4-primary:hover { background:#002B49; }
.btn-v4-ghost { background:#F8FAFC; color:#334155; border:1px solid #E2E8F0; }
.btn-v4-ghost:hover { border-color:#013856; color:#013856; }
.btn-v4-up { background:#1B7F4B; color:#fff; box-shadow:0 4px 12px -3px rgba(27,127,75,.3); }
.btn-v4-down { background:#B03038; color:#fff; box-shadow:0 4px 12px -3px rgba(176,48,56,.3); }

/* تبويبات علوية (الجوال) بنمط trading pl-tabs */
.pl-tabs-wrap { background:#fff; border:1px solid #E2E8F0; border-radius:1rem; padding:.35rem; margin-bottom:1rem; box-shadow:0 2px 10px rgba(1,56,86,.04); position:sticky; top:.5rem; z-index:20; }
.pl-tabs { display:flex; gap:.25rem; overflow-x:auto; scrollbar-width:none; }
.pl-tabs::-webkit-scrollbar { display:none; }
.pl-tab { flex:1; min-width:70px; padding:.6rem .5rem; border-radius:.65rem; background:transparent; color:#64748B; font-weight:700; font-size:.78rem; display:flex; flex-direction:column; align-items:center; gap:.2rem; border:none; cursor:pointer; white-space:nowrap; transition:all .15s; }
.pl-tab:hover { color:#013856; background:#F8FAFC; }
.pl-tab.active { background:#013856; color:#fff; box-shadow:0 4px 10px rgba(1,56,86,.2); }
.pl-tab svg { width:1.15rem; height:1.15rem; }
.pl-tab-lbl { font-size:.72rem; font-weight:800; }
@media (min-width:768px){ .pl-tabs-wrap { display:none; } }

/* بطاقة الترويسة الرئيسية (نمط bg-gradient-to-br trading) */
.hero-v4 { position:relative; overflow:hidden; background: linear-gradient(135deg, #013856 0%, #002B49 100%); border-radius:1.5rem; padding:1.5rem; box-shadow:0 12px 30px -8px rgba(1,56,86,.3); color:#fff; }
.hero-v4::before { content:''; position:absolute; top:-6rem; left:-6rem; width:16rem; height:16rem; background:rgba(255,255,255,.05); border-radius:50%; filter:blur(3rem); pointer-events:none; }
.hero-v4::after { content:''; position:absolute; bottom:-6rem; right:-6rem; width:16rem; height:16rem; background:rgba(9,89,142,.2); border-radius:50%; filter:blur(3rem); pointer-events:none; }
.hero-v4 > * { position:relative; z-index:1; }

/* شريط الحالة (يمين الترويسة على السطح المكتبي) */
.topbar-v4 { display:flex; align-items:center; background:#fff; padding:.65rem .85rem; border-radius:1rem; border:1px solid #F1F5F9; box-shadow:0 2px 10px rgba(1,56,86,.05); gap:.5rem; margin-bottom:1rem; }
.brand-mark { width:2.25rem; height:2.25rem; background:#013856; color:#fff; border-radius:.75rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* جداول بنمط trading */
table.tbl-v4 { width:100%; border-collapse:collapse; text-align:right; font-size:.85rem; }
table.tbl-v4 th { color:#64748B; font-weight:700; padding:.75rem .5rem; border-bottom:2px solid #E2E8F0; font-size:.75rem; }
table.tbl-v4 td { color:#1E293B; padding:.75rem .5rem; border-bottom:1px solid #F1F5F9; font-weight:600; }
table.tbl-v4 td.num { font-family:'IBM Plex Sans Arabic', monospace; font-weight:800; }
table.tbl-v4 tr:last-child td { border-bottom:none; }

/* الشريط الجانبي — احذفه على الجوال (تبويبات علوية بديلة) */
@media (max-width:767px){
  #sidebar { display:none !important; }
  .flex-1.md\:mr-64 { margin-right:0 !important; }
  header.h-16 { border-bottom:none; box-shadow:none; }
  main#portal { padding:.75rem !important; padding-bottom:5rem !important; }
}

/* تحسين الشريط الجانبي على السطح المكتبي (كحلي) */
@media (min-width:768px){
  #sidebar { background:#fff; border-left:1px solid #E2E8F0; }
  .nav-item.bg-brand-50 { background:#DBE7EF !important; color:#013856 !important; }
}

/* رأس الجوال — v5 أنيق ومتّسق */
.mob-head { display:flex; align-items:center; background:linear-gradient(135deg,#013856 0%,#002B49 100%); padding:.65rem .75rem; border-radius:1rem; box-shadow:0 4px 14px rgba(1,56,86,.18); gap:.5rem; margin-bottom:.65rem; color:#fff; }
.mob-head .brand-mark { width:2.5rem; height:2.5rem; background:rgba(255,255,255,.12); border-radius:.65rem; color:#d4af37; border:1px solid rgba(255,255,255,.15); }
.mob-head #mobBrandName { color:#fff !important; font-family:'Tajawal'; font-weight:800 !important; font-size:14px !important; }
.mob-head #mobRoleLabel { color:rgba(255,255,255,.7) !important; font-size:10.5px !important; }
.mob-head button { background:rgba(255,255,255,.1) !important; color:#fff !important; border:1px solid rgba(255,255,255,.12) !important; transition:.15s; }
.mob-head button:hover { background:rgba(255,255,255,.2) !important; }
.mob-head button[title="خروج"] { background:rgba(176,48,56,.25) !important; color:#FFB4B7 !important; border-color:rgba(176,48,56,.4) !important; }
@media (min-width:768px){ .mob-head { display:none; } }

/* استغلال كل المساحات على الجوال + أسماء كاملة (لا truncate صارم) */
@media (max-width:640px){
  main#portal { padding:.6rem !important; padding-bottom:calc(1rem + env(safe-area-inset-bottom)) !important; }
  .card-v4, .bg-white.rounded-2xl, .bg-white.rounded-3xl, .bg-white.p-5, .bg-white.p-6 { padding:.85rem !important; }
  h1.text-2xl { font-size:1.15rem !important; }
  h2, .sec-head-v4 h2 { font-size:1rem !important; }
  .truncate { white-space:normal !important; overflow:visible !important; text-overflow:clip !important; }
  .name-full, .co-name, [class*="name-full"] { line-height:1.35 !important; }
  .stat-mini { padding:.55rem !important; }
  .stat-mini .val { font-size:1.05rem !important; }
  .grid.gap-6 { gap:.65rem !important; }
  .grid.gap-4 { gap:.55rem !important; }
  .space-y-6 > * + * { margin-top:.75rem !important; }
  .space-y-5 > * + * { margin-top:.65rem !important; }
}

/* بطاقات إحصائية علوية (بنمط trading الصغيرة) */
.stat-mini { background:#fff; border:1px solid #E2E8F0; border-radius:1rem; padding:.85rem; }
.stat-mini .lbl { font-size:.72rem; color:#64748B; font-weight:700; margin-bottom:.35rem; display:flex; align-items:center; gap:.35rem; }
.stat-mini .val { font-family:'IBM Plex Sans Arabic', monospace; font-weight:800; font-size:1.25rem; color:#1E293B; }
.stat-mini .val.u { color:#1B7F4B; }
.stat-mini .val.d { color:#B03038; }

/* أيقونة أنيقة داخل مربّع صغير */
.ic-box { width:2rem; height:2rem; border-radius:.5rem; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.ic-box svg { width:1.1rem; height:1.1rem; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* أعلام الاحترافية: focus-visible واضح */
.btn-v4:focus-visible, .btn:focus-visible, .pl-tab:focus-visible { outline:2px solid #09598E; outline-offset:2px; }

/* شبكة التقويم — أنيقة وقابلة للتمرير على الجوال الضيق */
#teacherCal, #stCal, #pCal { min-width: 260px; }
@media (max-width:400px){
  #teacherCal, #stCal, #pCal { font-size:.75rem; }
  #teacherCal .grid-cols-7 > div, #stCal .grid-cols-7 > div, #pCal .grid-cols-7 > div { min-height:52px !important; padding:.2rem !important; }
}

/* modals — تحسين طراز */

/* ============ الإشعارات الخارجية (Web Push) ============ */
let _swReg=null;
const pushSupported = ()=> ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
function urlB64ToUint8Array(base64String){
  const padding='='.repeat((4 - base64String.length % 4) % 4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64); const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
async function registerSW(){
  if(!('serviceWorker' in navigator)) return null;
  try{ _swReg = _swReg || await navigator.serviceWorker.register('/sw.js'); return _swReg; }catch(e){ return null; }
}
window.addEventListener('load',()=>{ registerSW(); });
async function pushStatus(){
  if(!pushSupported()||!_swReg) return 'unsupported';
  if(Notification.permission==='denied') return 'denied';
  try{ const sub=await _swReg.pushManager.getSubscription(); return sub?'on':'off'; }catch(e){ return 'off'; }
}
async function enablePush(){
  if(!pushSupported()) return toast('جهازك لا يدعم الإشعارات','warn');
  if(!_swReg) await registerSW();
  if(!_swReg) return toast('تعذّر تفعيل الإشعارات','error');
  const perm = await Notification.requestPermission();
  if(perm!=='granted') return toast('تم رفض إذن الإشعارات من المتصفح','warn');
  const v = await DS.pushVapid();
  const vkey = (v&&v.key||'').replace(/[^A-Za-z0-9_\-]/g,''); // إزالة أي BOM/رموز غير قاعدية
  if(!vkey) return toast('الإشعارات غير مهيّأة على الخادم','error');
  try{
    const sub = await _swReg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlB64ToUint8Array(vkey) });
    const r = await DS.pushSubscribe(sub.toJSON());
    if(r&&r.success){ toast('تم تفعيل الإشعارات على هذا الجهاز'); }
    else toast((r&&r.message)||'فشل الاشتراك','error');
  }catch(e){ toast('تعذّر الاشتراك في الإشعارات','error'); }
  refreshPushUI();
}
async function disablePush(){
  try{
    const sub = _swReg && await _swReg.pushManager.getSubscription();
    if(sub){ await DS.pushUnsubscribe(sub.endpoint); await sub.unsubscribe(); }
    toast('تم إيقاف الإشعارات على هذا الجهاز');
  }catch(e){}
  refreshPushUI();
}
async function togglePush(){ const s=await pushStatus(); if(s==='on') disablePush(); else enablePush(); }
async function refreshPushUI(){
  const btn=$('pushToggleBtn'); if(!btn) return;
  const s=await pushStatus();
  const map={ on:['الإشعارات مفعّلة — إيقاف','bg-green-100 text-green-700 border border-green-200'],
              off:['تفعيل الإشعارات على هذا الجهاز','bg-brand-900 text-white'],
              denied:['الإشعارات محظورة في إعدادات المتصفح','bg-gray-100 text-gray-400'],
              unsupported:['جهازك لا يدعم الإشعارات','bg-gray-100 text-gray-400'] };
  const [label,cls]=map[s]||map.off;
  btn.textContent=label; btn.className='btn w-full text-sm '+cls;
  btn.disabled = (s==='denied'||s==='unsupported');
}

async function drawCharts(){
  try{ await ensureLib('chart'); }catch(e){ return; }
  const cs=getComputedStyle(document.documentElement); const cv=n=>cs.getPropertyValue(n).trim();
  const tick=cv('--ink3')||'#8F97A6',grid=cv('--line')||'#E7E9EE';
  const days=[],labels=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const s=ymd(d);days.push(s);labels.push(s.slice(5))}
  const done=days.map(ds=>_tData.plans.filter(p=>p.Date===ds&&p.Accomplishment_Status==='Done').length);
  const par=days.map(ds=>_tData.plans.filter(p=>p.Date===ds&&p.Accomplishment_Status==='Partial').length);
  const mis=days.map(ds=>_tData.plans.filter(p=>p.Date===ds&&p.Accomplishment_Status==='Missed').length);
  const ctx=$('ch_days'); if(!ctx)return;
  new Chart(ctx.getContext('2d'),{type:'bar',data:{labels,datasets:[{label:'مكتمل',data:done,backgroundColor:cv('--ok'),stack:'s',borderRadius:5},{label:'جزئي',data:par,backgroundColor:cv('--warn'),stack:'s',borderRadius:5},{label:'لم يحفظ',data:mis,backgroundColor:cv('--bad'),stack:'s',borderRadius:5}]},options:{plugins:{legend:{position:'bottom',labels:{font:{family:'IBM Plex Sans Arabic'},color:tick,boxWidth:10,boxHeight:10}}},scales:{x:{stacked:true,ticks:{color:tick},grid:{color:grid}},y:{stacked:true,ticks:{color:tick},grid:{color:grid}}}}});
}

/* --- استيراد CSV --- */
function parseCSV(text){
  const rows=[]; let cur=[], val='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){val+='"';i++} else q=false } else val+=c; }
    else { if(c==='"')q=true; else if(c===','){cur.push(val);val=''} else if(c==='\n'){cur.push(val);rows.push(cur);cur=[];val=''} else if(c==='\r'){} else val+=c; }
  }
  if(val!==''||cur.length){cur.push(val);rows.push(cur)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}

async function doMpSaveItem(planId, status){
  const form = document.querySelector(`[data-mp-form="${planId}"]`);
  // Auto-partial: if recorded range < required daily amount → mark Partial automatically
  if(status==='Done' && form){
    const p=(_tData.plans||[]).find(x=>String(x.Plan_ID)===String(planId));
    const req=Number(p?.Amount)||0;
    if(p && req>0){
      const toSurahEl=form.querySelector('[data-k="toSurah"]');
      const toAyahEl=form.querySelector('[data-k="toAyah"]');
      if(toSurahEl&&toAyahEl){
        const fromOrd=qAyahOrdinal(String(p.From_Surah),Number(p.From_Ayah)||1);
        const toOrd=qAyahOrdinal(toSurahEl.value,Number(toAyahEl.value)||1);
        const actual=Math.abs(toOrd-fromOrd)+1;
        if(actual>0&&actual<req) status='Partial';
      }
    }
  }
  const upd = { Accomplishment_Status: status };
  let attStatus = null;
  if(form){
    form.querySelectorAll('[data-k]').forEach(el=>{
      const k = el.dataset.k, v = el.value;
      if(k==='toSurah') upd.To_Surah = v;
      else if(k==='toAyah') upd.To_Ayah = v;
      else if(k==='attendance') attStatus = v;
      else if(k==='mistakes') upd.Mistakes = Number(v)||0;
      else if(k==='hearing') upd.Hearing = Number(v)||0;
      else if(k==='repetition') upd.Repetition = Number(v)||0;
    });
  }
  const r = await guard(DS.updatePlan(planId, upd), 'حفظ التقييم…');
  if(!r||!r.success) return toast((r&&r.message)||'فشل','error');
  const p = (_tData.plans||[]).find(x=>String(x.Plan_ID)===String(planId));
  if(p){ Object.assign(p, { Accomplishment_Status: status, To_Surah: upd.To_Surah||p.To_Surah, To_Ayah: upd.To_Ayah||p.To_Ayah, Mistakes: upd.Mistakes, Hearing: upd.Hearing, Repetition: upd.Repetition }); }
  // احفظ الحضور المدمج مع الرصد

function _mpPlanDirChange(){
  const dir=document.querySelector('[name="cp_dir"]:checked')?.value||'asc';
  const on='flex items-center gap-2 p-2 rounded-lg border border-brand-300 bg-brand-50 cursor-pointer transition';
  const off='flex items-center gap-2 p-2 rounded-lg border border-slate-200 bg-white cursor-pointer transition';

function _cpUpdateAyahMax(ayahId, surahId){

  const idx=surs.indexOf(sel.value); if(idx<0) return;

async function doCreateManualPlan(){
  const type = $('cp_type').value;
  const unit = $('cp_unit').value;
  const planCfg = _tData?.planConfig || {};
  const startDate = planCfg.termStart || '';
  const endDate = planCfg.termEnd || '';
  const workDays = planCfg.workDays?.length ? planCfg.workDays : [];
  if(!startDate || !endDate) return toast('عيّن بداية ونهاية الفصل في الإعدادات → أيام الحلقة','warn');
  if(!workDays.length) return toast('عيّن أيام الحلقة في الإعدادات → أيام الحلقة','warn');
  // Collect ranges
  const ranges = [];
  const fromSurah0=$('cp_fromS').value, toSurah0=$('cp_toS').value;
  const fromAyah0=Number($('cp_fromA').value)||1, toAyah0=Number($('cp_toA').value)||1;
  if(!fromSurah0||!toSurah0) return toast('اختر نطاق القرآن','warn');
  ranges.push({fromSurah:fromSurah0,fromAyah:fromAyah0,toSurah:toSurah0,toAyah:toAyah0});
  document.querySelectorAll('[id^="cp_range_"]').forEach(div=>{
    const n=div.id.replace('cp_range_','');
    const fS=document.getElementById(`cp_fromS_${n}`)?.value;
    const fA=Number(document.getElementById(`cp_fromA_${n}`)?.value)||1;
    const tS=document.getElementById(`cp_toS_${n}`)?.value;
    const tA=Number(document.getElementById(`cp_toA_${n}`)?.value)||1;
    if(fS&&tS) ranges.push({fromSurah:fS,fromAyah:fA,toSurah:tS,toAyah:tA});
  });
  let daily;
  if(unit==='custom'){
    daily = Number($('cp_daily').value) || undefined;
  } else {
    daily = qExactAyahs(fromSurah0,fromAyah0,unit) || MP_UNITS[unit]?.ayat;
  }
  const replaceExisting = $('cp_replace').checked;
  if(startDate>endDate) return toast('البداية يجب أن تسبق النهاية','warn');
  const payload = { studentId: _mp.studentId, type, startDate, endDate, ranges, workDays, dailyAmount: daily, replaceExisting };
  const r = await guard(DS.planGenerate(payload),'توليد الخطة…');
  if(!r||!r.success) return toast((r&&r.message)||'فشل التوليد','error');
  closeModal();
  toast(`تم توليد ${r.created} يوم${r.replaced?` (استُبدل ${r.replaced})`:''}`);
  await refreshTeacherStudents();
  _mp.openIds.add(String(_mp.studentId));
  renderManualPlanTab($('fuSubBody'));
}

async function doEditManualPlan(){
  const sid = _mp.studentId;
  const type = $('ep2_type')?.value;
  const daily = Number($('ep2_daily')?.value)||0;
  const fromSurah = $('ep2_fromS')?.value;
  const fromAyah  = Number($('ep2_fromA')?.value)||1;
  const toSurah   = $('ep2_toS')?.value;
  const toAyah    = Number($('ep2_toA')?.value)||1;
  const startDate = $('ep2_start')?.value || '';
  const endDate   = $('ep2_end')?.value || '';
  if(!fromSurah||!toSurah) return toast('اختر نطاق القرآن','warn');
  if(daily<1) return toast('أدخل مقداراً يومياً صحيحاً','warn');
  if(!startDate||!endDate) return toast('أدخل تاريخي البداية والنهاية','warn');
  if(startDate>endDate) return toast('البداية يجب أن تسبق النهاية','warn');
  const cfg = _tData?.planConfig || {};
  const workDays = cfg.workDays?.length ? cfg.workDays : [0,1,2,3,4];
  const payload = { studentId:sid, type, startDate, endDate, ranges:[{fromSurah,fromAyah,toSurah,toAyah}], workDays, dailyAmount:daily, replaceExisting:true };
  const r = await guard(DS.planGenerate(payload),'إعادة توليد الخطة…');
  if(!r||!r.success) return toast((r&&r.message)||'فشل التوليد','error');
  closeModal();
  toast(`تم توليد ${r.created} يوم${r.replaced?` (استُبدل ${r.replaced})`:''}`);

  renderManualPlanTab($('fuSubBody'));

  if(!_nz.termId||!_nz.planId){
    $('nz_body').innerHTML=`<div class="bg-white p-12 text-center rounded-2xl shadow-saas border-2 border-dashed border-gray-200">
      <div class="w-20 h-20 mx-auto rounded-2xl bg-gold-100 text-gold-600 flex items-center justify-center mb-4">${svg('cog','w-10 h-10')}</div>
      <p class="text-gray-700 font-extrabold mb-2 text-lg">لم يتم اختيار الحلقة بعد</p>
      <p class="text-gray-500 font-bold mb-6 text-sm">اضبط الفصل الدراسي والحلقة أولاً لتتمكن من عرض ومتابعة الطلاب</p>
      <button onclick="openNazemSettings()" class="btn bg-brand-900 text-white shadow-md">${svg('cog','w-4 h-4')} افتح إعدادات المتابعة</button>
    </div>`;
    return;
  }

  const plansRes=await guard(DS.nazemPlans(_nz.termId), 'جلب بيانات الحلقة...');
  if(plansRes?.success){
    _nz.plans=plansRes.plans;
    const p=plansRes.plans.find(x=>String(x.id)===String(_nz.planId));
    if(p) $('nz_planLabel').textContent=p.class_name+' · '+(p.company||'');
  }

  loadNzFollow();
}

function nzSetFilter(t){ _nz.typeFilter = t; renderNzBody(); }
function nzSetSearch(v){
  _nz.search = v||'';
  const cur = document.activeElement;
  const wasFocus = cur && cur.id === 'nz_search';
  const selStart = wasFocus ? cur.selectionStart : null;
  renderNzBody();
  if(wasFocus){
    const el = $('nz_search');
    if(el){ el.focus(); try{ if(selStart!=null) el.setSelectionRange(selStart, selStart); }catch(e){} }
  }
}
function nzFilterItems(items){
  if(_nz.typeFilter==='all') return items||[];
  return (items||[]).filter(it => String(it.type||'conserve') === _nz.typeFilter);
}

async function loadNzsTerms(){const r=await guard(DS.nazemTerms(),'جلب الفصول…');if(!r||!r.success)return;$('nzs_term').innerHTML=r.terms.map(t=>`<option value="${esc(t.id)}" ${String(t.id)===String(_nz.termId)?'selected':''}>${esc(t.name)}</option>`).join('');onNzsTermChange();}
async function onNzsTermChange(){const tid=$('nzs_term').value;const r=await guard(DS.nazemPlans(tid),'جلب الخطط…');if(!r||!r.success)return;$('nzs_plan').innerHTML=r.plans.map(p=>`<option value="${esc(p.id)}" ${String(p.id)===String(_nz.planId)?'selected':''}>${esc(p.class_name)} — ${esc(p.company||'')} (${p.students_count} طالب)</option>`).join('');}
async function saveNazemSettings(){const tid=$('nzs_term').value,pid=$('nzs_plan').value;if(!tid||!pid)return toast('اختر الفصل والخطة','warn');await guard(Promise.all([DS.setSetting('nz_term',tid),DS.setSetting('nz_plan',pid)]),'حفظ…');_nz.termId=tid;_nz.planId=pid;closeModal();toast('تم الحفظ');renderNazemTab($('portal'));}

async function loadNzFollow(opts){
  opts = opts || {};
  const box=$('nz_body');
  _nz.date=$('nz_date').value;

  // كاش: اعرض الفوري ثم حدّث بالخلفية
  const cached = _nzCacheGet();
  if(cached && !opts.force){
    _nz.data = cached;
    renderNzBody();
    // مؤشر تحديث خفيف
    const badge = document.createElement('div');
    badge.id='nz_refresh_badge';
    badge.className='fixed bottom-4 right-4 z-40 bg-brand-900 text-gold-500 px-3 py-1.5 rounded-full text-xs font-bold shadow-lg flex items-center gap-2 fade-in';
    badge.innerHTML='<div class="w-3 h-3 border-2 border-gold-500 border-t-transparent rounded-full animate-spin"></div> تحديث بالخلفية…';
    document.body.appendChild(badge);
    try{
      const r = await DS.nazemFollowUp(_nz.planId,_nz.date);
      if(r&&r.success){ _nz.data=r.data; _nzCacheSet(r.data); renderNzBody(); }
    }catch(e){}
    finally{ const b=$('nz_refresh_badge'); if(b) b.remove(); }
    return;
  }

  if(box) box.innerHTML='<div class="text-center py-12"><div class="spinner mx-auto"></div><p class="text-gray-500 font-bold mt-4 text-sm">جاري تحميل بيانات المتابعة...</p></div>';
  const r=await guard(DS.nazemFollowUp(_nz.planId,_nz.date),'تحميل سجل المتابعة من ناظم…');
  if(!r||!r.success){
    if(box) box.innerHTML=`<div class="bg-white p-8 rounded-2xl shadow-saas border border-red-100 text-center">
      <div class="flex justify-center mb-3">${svg('warn','w-10 h-10 text-danger')}</div>
      <p class="text-danger font-extrabold text-lg mb-2">تعذر جلب البيانات</p>
      <p class="text-gray-500 font-bold text-sm">${esc((r&&r.message)||'حدث خطأ في جلب البيانات')}</p>
    </div>`;
    return;
  }
  _nz.data=r.data;
  _nzCacheSet(r.data);
  renderNzBody();
}

function renderNzBody(){
  const d=_nz.data||{}; let students=d.students||[];

  // إحصائيات لكل نوع
  const allItems = [];
  (d.students||[]).forEach(s => (s.items||[]).forEach(it => allItems.push(it)));
  const countByType = {conserve:0, revision:0, mastery:0};
  allItems.forEach(it => { const t=String(it.type||'conserve'); if(countByType[t]!==undefined) countByType[t]++; });

  const doneCount = allItems.filter(it => it.today && it.today.status==='completed').length;
  const pendingCount = allItems.filter(it => it.today && it.today.status!=='completed' && !it.is_blocked_by_late).length;
  const progressPct = allItems.length ? Math.round((doneCount/allItems.length)*100) : 0;

  // بحث بالاسم
  if(_nz.search){
    students = students.filter(s => arMatches(s.student_name||'', _nz.search));
  }

  // فلترة الطلاب حسب النوع
  let filteredStudents = students;
  if(_nz.typeFilter !== 'all'){
    filteredStudents = students.filter(s => nzFilterItems(s.items).length > 0);
  }

  // شريط الإحصائيات
  const info=`<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
    <div class="bg-gradient-to-br from-brand-900 to-brand-800 text-white p-4 rounded-2xl shadow-md">
      <p class="text-[11px] font-bold text-gold-500 mb-1">الحلقة</p>
      <p class="font-extrabold truncate text-sm">${esc(d.class_name||'—')}</p>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow-saas border border-gray-50">
      <p class="text-[11px] font-bold text-gray-500 mb-1">تقدم اليوم</p>
      <div class="flex items-center gap-2">
        <p class="font-extrabold text-success text-xl tabular-nums">${progressPct}%</p>
        <div class="flex-1 bg-gray-100 h-2 rounded-full overflow-hidden"><div class="h-full bg-success rounded-full transition-all" style="width:${progressPct}%"></div></div>
      </div>
      <p class="text-[10px] font-bold text-gray-400 mt-1">${doneCount} من ${allItems.length} بند</p>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow-saas border border-gray-50">
      <p class="text-[11px] font-bold text-gray-500 mb-1">الطلاب</p>
      <p class="font-extrabold text-gray-900 text-xl tabular-nums">${(d.students||[]).length}</p>
      <p class="text-[10px] font-bold text-gray-400 mt-1">${filteredStudents.length} معروض</p>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow-saas border border-gray-50">
      <p class="text-[11px] font-bold text-gray-500 mb-1">التاريخ الهجري</p>
      <p class="font-extrabold text-gold-600 text-sm leading-tight mt-1">${toHijri(d.date)}</p>
    </div>
  </div>`;

  // تبويبات الفلترة (كل / حفظ / مراجعة / إتقان)
  const tabs = Object.keys(NZ_TYPES).map(k => {
    const t = NZ_TYPES[k];
    const active = _nz.typeFilter === k;
    const count = k==='all' ? allItems.length : (countByType[k]||0);
    const baseCls = active ? t.activeCls : 'bg-white text-gray-600 hover:bg-gray-50 border-gray-200';
    const bCls   = active ? t.badgeActiveCls : t.badgeCls;
    return `<button onclick="nzSetFilter('${k}')" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm border transition-all-fast ${baseCls}">
      <span>${svg(t.icon,'w-4 h-4')}</span>
      <span>${t.label}</span>
      <span class="px-2 py-0.5 rounded-full text-[11px] tabular-nums ${bCls}">${count}</span>
    </button>`;
  }).join('');

  const filterBar = `<div class="bg-white p-4 rounded-2xl shadow-saas border border-gray-50 mb-5">
    <div class="flex items-center justify-between flex-wrap gap-3">
      <div class="flex flex-wrap gap-2">${tabs}</div>
      <div class="flex gap-2">
        <button onclick="doNzExpandAll(true)" class="btn bg-gray-50 text-gray-600 hover:bg-gray-100 text-xs py-2 px-3 flex items-center gap-1" title="فتح الكل">${svg('arrowdown','w-3 h-3')} فتح الكل</button>
        <button onclick="doNzExpandAll(false)" class="btn bg-gray-50 text-gray-600 hover:bg-gray-100 text-xs py-2 px-3 flex items-center gap-1" title="طي الكل">${svg('arrowup','w-3 h-3')} طي الكل</button>
        <button onclick="doNzBulkAttendance()" class="btn bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 text-sm py-2 px-3">${svg('check','w-4 h-4')} حضور الكل</button>
        <button onclick="doNzSaveAll()" class="btn bg-gradient-to-l from-brand-900 to-brand-800 text-white text-sm py-2 px-4 shadow-md hover:shadow-lg" title="حفظ كل التقييمات المعبأة">
          ${svg('cloud','w-4 h-4')} حفظ الكل
          <span class="px-2 py-0.5 rounded-full bg-white/20 text-[11px] tabular-nums">${pendingCount}</span>
        </button>
      </div>
    </div>
  </div>`;

  // شبكة البطاقات
  const html = filteredStudents.length
    ? filteredStudents.map((st,i)=>renderNzStudent(st,i<4)).filter(Boolean).join('')
    : `<div class="col-span-full bg-white p-12 text-center rounded-2xl shadow-saas border-2 border-dashed border-gray-200">
        <div class="flex justify-center mb-3">${_nz.search?svg('search','w-10 h-10 text-gray-400'):(students.length===0?svg('warn','w-10 h-10 text-gray-400'):svg('book','w-10 h-10 text-gray-400'))}</div>

        <p class="text-gray-400 font-bold text-sm">${_nz.search?'جرّب كلمة بحث أخرى':(students.length===0?'تحقق من إعدادات الحلقة أو حاول الاستيراد من ناظم':'جرّب اختيار تصنيف آخر أو "الكل"')}</p>
      </div>`;

  $('nz_body').innerHTML = info + nzUnlinkedBanner() + filterBar + '<div class="grid grid-cols-1 xl:grid-cols-2 gap-4">' + html + '</div>';
}

function doNzExpandAll(open){
  document.querySelectorAll('#nz_body details').forEach(d => { d.open = !!open; });
}

function renderNzStudent(st,open){
  const items = nzFilterItems(st.items);
  if(!items.length && _nz.typeFilter!=='all') return '';

  const itemsHtml = items.map(it=>renderNzItem(it,st)).join('');
  const c=(st.student_name||'?').trim().charAt(0);
  const attSt=st.attendance_status;
  const attBadge = attSt==2 ? '<span class="chip bg-green-100 text-green-700">✓ حاضر</span>'
                : attSt==1 ? '<span class="chip bg-gold-100 text-gold-700">⏱ متأخر</span>'
                : attSt==0 ? '<span class="chip bg-red-100 text-red-700">✗ غائب</span>'
                : '<span class="chip bg-gray-100 text-gray-500">— لم يسجَّل</span>';

  const doneItems = items.filter(it => it.today && it.today.status==='completed').length;
  const totalItems = items.length;
  const pct = totalItems ? Math.round((doneItems/totalItems)*100) : 0;
  const progressColor = pct>=100?'#10b981':pct>=50?'#d4af37':'#3b82f6';

  const localMatch = _tData?.students?.find(x=>String(x.Nazem_ID||'')===String(st.student_id||''))
                  || _tData?.users?.find(u=>u.Role==='Student' && normAr(u.Name)===normAr(st.student_name));
  const localId = localMatch ? (localMatch.Student_ID || localMatch.ID) : '';
  const localPts = localMatch ? (_tData.students.find(x=>String(x.Student_ID)===String(localId))?.Total_Points||0) : null;

  const quickBtn = localId
    ? `<button onclick="event.preventDefault();event.stopPropagation();fQuickPoint(${jsArg(localId)})" title="نقاط إضافية" class="w-10 h-10 rounded-xl bg-gold-100 text-gold-700 hover:bg-gold-200 flex items-center justify-center shrink-0 transition">${svg('plus','w-5 h-5')}</button>`
    : `<button onclick="event.preventDefault();event.stopPropagation();nzLinkStudentPrompt(${jsArg(st.student_id||'')},${jsArg(st.student_name||'')})" title="اربطه بحسابه" class="px-3 h-10 rounded-xl bg-orange-100 text-orange-700 hover:bg-orange-200 flex items-center justify-center shrink-0 font-bold text-xs transition whitespace-nowrap">ربط</button>`;

  return `<details class="nz-card" ${open?'open':''} data-nz-student="${esc(st.student_id||'')}">
    <summary class="p-3 sm:p-4 cursor-pointer hover:bg-gray-50/50 transition select-none outline-none" style="list-style:none">
      <div class="flex items-start gap-3">
        <div class="nz-avatar w-12 h-12 text-lg">${esc(c)}</div>
        <div class="flex-1 min-w-0">
          <div class="font-extrabold text-gray-900 name-full text-base sm:text-lg leading-tight mb-1">${esc(st.student_name)}</div>
          <div class="flex items-center gap-1.5 flex-wrap mb-2">
            ${attBadge}
            ${localPts!==null?`<span class="chip bg-gold-100 text-gold-700">${svg('coin','w-3 h-3 inline-block')} ${localPts}</span>`:''}
            <span class="chip bg-brand-50 text-brand-700">${items.length} بند</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="nz-progress-track flex-1"><div class="nz-progress-fill" style="width:${pct}%;background:${progressColor}"></div></div>
            <span class="text-xs font-extrabold text-gray-700 tabular-nums shrink-0">${doneItems}/${totalItems}</span>
          </div>
        </div>
        ${quickBtn}
      </div>
    </summary>
    <div class="px-3 sm:px-4 pb-3 sm:pb-4 pt-2 border-t border-gray-100 bg-surface/40">
      ${itemsHtml||'<p class="text-gray-400 text-sm font-bold text-center py-4">لا توجد بنود</p>'}
    </div>
  </details>`;
}

async function doNzLink(nazemId){const lid=$('nzlink_sel').value; if(!lid) return toast('اختر طالباً','warn');const r=await guard(DS.linkNazemStudent(lid,nazemId),'ربط…');if(r&&r.success){toast('تم الربط');const s=_tData.students.find(x=>String(x.Student_ID)===String(lid)); if(s) s.Nazem_ID=nazemId;closeModal(); renderNzBody();}}
/* الربط من نافذة "طلاب بدون تطابق" بعد المزامنة — تقرأ العنصر link_<nazemId> */
async function doLinkNazem(nazemId){
  const sel=$('link_'+nazemId); const lid=sel?sel.value:'';
  if(!lid) return toast('اختر طالباً من القائمة','warn');

}

/* ============ بيانات الدخول الجديدة (تُعرض مرة واحدة بعد الإنشاء) ============ */
let _credRows=[];
function credRowsFrom(results){
  const out=[];
  (results||[]).forEach(r=>{
    out.push({name:r.name, role:'طالب', id:r.id, password:r.password});
    if(r.parentId) out.push({name:r.parentName, role:'ولي أمر', id:r.parentId, password:r.parentPassword});

}
function showCredentials(title, rows, intro, errors){

    <button onclick="closeModal()" class="btn bg-gray-100 text-gray-700 w-full">تم</button>

}
function credText(){ return _credRows.map(r=>`${r.name} (${r.role})\nالمعرّف: ${r.id}\nكلمة المرور: ${r.password}`).join('\n\n'); }
async function credCopyAll(){ try{ await navigator.clipboard.writeText(credText()); toast('تم النسخ'); }catch(e){ toast('تعذّر النسخ — استخدم «تنزيل ملف»','error'); } }
function credDownload(){
  const lines=[['الاسم','الدور','المعرّف','كلمة المرور'],..._credRows.map(r=>[r.name,r.role,r.id,r.password])].map(a=>a.map(csvCell).join(',')).join('\n');
  downloadFile('accounts-'+ymd(new Date())+'.csv', lines, 'text/csv');
}

/* ============ الأيام الأقدم من نافذة بيانات المعلم (٤٥ يوماً) تُجلب عند الحاجة ============ */
async function ensureDayLoaded(date){
  if(!_tData||!date||!_tData.windowStart||date>=_tData.windowStart) return;
  _tData._days=_tData._days||{};
  if(_tData._days[date]) return;
  const r=await guard(DS.dayData(date),'تحميل بيانات اليوم…');
  if(!r||!r.success) return;
  _tData._days[date]=true;
  const pIds=new Set((_tData.plans||[]).map(p=>String(p.Plan_ID)));
  (r.plans||[]).forEach(p=>{ if(!pIds.has(String(p.Plan_ID))) _tData.plans.push(p); });
  const aKeys=new Set((_tData.attendance||[]).map(a=>String(a.Student_ID)+'|'+a.Date));
  (r.attendance||[]).forEach(a=>{ if(!aKeys.has(String(a.Student_ID)+'|'+a.Date)) _tData.attendance.push(a); });
}

async function doNzCreateAccounts(){
  const picked=[...document.querySelectorAll('.nzc-st')].filter(c=>c.checked).map(c=>({nazemId:c.dataset.nz,name:c.dataset.name}));
  if(!picked.length) return toast('اختر طالباً واحداً على الأقل','warn');
  const pw=$('nzc_pw').value.trim(); if(pw&&pw.length<4) return toast('كلمة المرور قصيرة','warn');
  const payload={groupId:$('nzc_group').value||null, autoParent:$('nzc_parent').checked, password:pw};
  const results=[], errors=[]; const CH=15; // دفعات صغيرة ضمن مهلة الخادم
  try{
    for(let i=0;i<picked.length;i+=CH){
      loader(true,`إنشاء الحسابات… ${Math.min(i+CH,picked.length)}/${picked.length}`);
      const r=await DS.nazemCreateStudents({...payload, students:picked.slice(i,i+CH)});
      if(!r||!r.success){ if(r&&r._auth) return; errors.push({name:'دفعة '+(i/CH+1), message:(r&&r.message)||'فشل'}); continue; }
      results.push(...(r.results||[])); errors.push(...(r.errors||[]));
    }
  } finally { loader(false); }
  closeModal();
  await refreshTeacherStudents();
  if(_nz.data) renderNzBody();
  showCredentials('حسابات طلاب ناظم', credRowsFrom(results), `تم إنشاء <b>${results.length}</b> حساب طالب وربطها بناظم.`, errors);
}

  try{
    const r = await DS.nazemSavePartial(itemDayId,p);
    if(r&&r.success){
      toast(r.message||'تم الحفظ');
      _nzCacheClear(); // إبطال الكاش لأن البيانات تغيرت
      // تحديث بالخلفية بدون شاشة تحميل
      DS.nazemFollowUp(_nz.planId,_nz.date).then(fr=>{ if(fr&&fr.success){ _nz.data=fr.data; _nzCacheSet(fr.data); renderNzBody(); } });

  } catch(e){ toast('خطأ في الحفظ','error'); }
  finally{ btn.disabled=false; btn.innerHTML = originalHtml; }
}

/* حفظ الكل — يحفظ جميع النماذج المعبأة دفعة واحدة */
async function doNzSaveAll(){
  const forms = document.querySelectorAll('#nz_body [data-nz-form]');
  if(!forms.length) return toast('لا توجد بنود قابلة للحفظ في هذا التصنيف','warn');
  const surs = _tData?.surahs||[];
  const tasks = [];
  forms.forEach(f=>{
    const itemDayId = f.getAttribute('data-nz-form');
    const p = {}; f.querySelectorAll('[data-k]').forEach(el=>p[el.dataset.k]=el.value);
    const surIdx = surs.indexOf(p.actual_end_surah)+1;
    if(!surIdx || !p.actual_end_aya) return;
    p.actual_end_surah = surIdx;
    tasks.push({itemDayId, payload:p});
  });
  if(!tasks.length) return toast('لا توجد بيانات صالحة للحفظ','warn');

  openModal('تأكيد الحفظ الجماعي', `
    <div class="text-center py-2">
      <div class="flex justify-center mb-3">${svg('cloud','w-10 h-10 text-brand-900')}</div>
      <p class="font-extrabold text-gray-900 text-lg mb-2">سيتم حفظ ${tasks.length} تقييم في ناظم</p>
      <p class="text-sm font-bold text-gray-500 mb-6">قد تستغرق العملية عدة ثوانٍ حسب عدد البنود.</p>
      <div class="flex gap-3">
        <button onclick="doNzSaveAllRun()" class="btn bg-gradient-to-l from-brand-900 to-brand-800 text-white flex-1 shadow-md">ابدأ الحفظ</button>
        <button onclick="closeModal()" class="btn bg-gray-100 text-gray-700 flex-1">إلغاء</button>
      </div>
    </div>`);
  window._nzSaveTasks = tasks;
}

async function doNzSaveAllRun(){
  const tasks = window._nzSaveTasks || [];
  closeModal();
  if(!tasks.length) return;
  window._nzSaveTasks = null;

  // شريط تقدم عائم بالخلفية — لا يمنع التفاعل
  const badge = document.createElement('div');
  badge.id='nz_bulk_badge';
  badge.className='fixed bottom-4 right-4 left-4 sm:left-auto sm:min-w-[320px] z-40 bg-brand-900 text-white px-4 py-3 rounded-2xl shadow-2xl fade-in';
  badge.innerHTML = `<div class="flex items-center gap-3">
    <div class="w-5 h-5 border-2 border-gold-500 border-t-transparent rounded-full animate-spin shrink-0"></div>
    <div class="flex-1 min-w-0">
      <div class="font-extrabold text-sm">حفظ ${tasks.length} تقييم بالخلفية</div>
      <div class="text-xs text-gold-100 font-bold mt-0.5" id="nz_bulk_status">0/${tasks.length}</div>
    </div>
  </div>
  <div class="mt-2 h-1.5 bg-white/10 rounded-full overflow-hidden"><div id="nz_bulk_bar" class="h-full bg-gold-500 rounded-full transition-all" style="width:0%"></div></div>`;
  document.body.appendChild(badge);

  // حفظ متوازي في مجموعات (concurrency) لتفادي إغراق الخادم
  const concurrency = 4;
  let ok=0, fail=0, done=0;
  const update=()=>{
    const st=$('nz_bulk_status'); if(st) st.textContent=`${done}/${tasks.length} · نجح ${ok}${fail?` · فشل ${fail}`:''}`;
    const bar=$('nz_bulk_bar'); if(bar) bar.style.width = Math.round((done/tasks.length)*100)+'%';
  };
  const runOne = async (t)=>{
    try{ const r = await DS.nazemSavePartial(t.itemDayId, t.payload); if(r&&r.success) ok++; else fail++; }
    catch(e){ fail++; }
    done++; update();
  };
  // pool
  const queue = tasks.slice();
  const workers = Array.from({length: Math.min(concurrency, queue.length)}, async ()=>{
    while(queue.length){ const t=queue.shift(); if(t) await runOne(t); }
  });
  await Promise.all(workers);

  const b=$('nz_bulk_badge'); if(b) b.remove();
  toast(`تم حفظ ${ok} بند${fail?` · فشل ${fail}`:''}`, fail?'warn':'success');
  _nzCacheClear();
  loadNzFollow({force:true});
}

async function doNzBulkAttSet(status){
  closeModal();
  const d = _nz.data || {}; const students = d.students || [];

  // احتساب المستهدفين المرتبطين محلياً
  const targets = students.map(st=>{
    const localMatch = _tData?.students?.find(x=>String(x.Nazem_ID||'')===String(st.student_id||''))
                    || _tData?.users?.find(u=>u.Role==='Student' && normAr(u.Name)===normAr(st.student_name));
    return localMatch ? (localMatch.Student_ID || localMatch.ID) : null;
  }).filter(Boolean);
  const skipped = students.length - targets.length;

  if(!targets.length){ toast('لا يوجد طلاب مرتبطون محلياً','warn'); return; }

  // شريط حفظ عائم بالخلفية
  const badge = document.createElement('div');
  badge.id='nz_att_badge';
  badge.className='fixed bottom-4 right-4 left-4 sm:left-auto sm:min-w-[300px] z-40 bg-brand-900 text-white px-4 py-3 rounded-2xl shadow-2xl fade-in';
  badge.innerHTML = `<div class="flex items-center gap-3"><div class="w-5 h-5 border-2 border-gold-500 border-t-transparent rounded-full animate-spin shrink-0"></div><div class="flex-1"><div class="font-extrabold text-sm">حفظ الحضور بالخلفية</div><div class="text-xs text-gold-100 font-bold" id="nz_att_status">0/${targets.length}</div></div></div>`;
  document.body.appendChild(badge);

  let ok=0, done=0;
  const update=()=>{ const s=$('nz_att_status'); if(s) s.textContent=`${done}/${targets.length}`; };
  await Promise.all(targets.map(async sid=>{
    try{ const r = await DS.saveAttendance(sid, _nz.date, status, 'حضور جماعي', currentUser.ID); if(r&&r.success!==false) ok++; }catch(e){}
    done++; update();
  }));

  const b=$('nz_att_badge'); if(b) b.remove();
  toast(`تم تسجيل الحضور لـ ${ok} طالب${skipped?` · تُخُطّي ${skipped}`:''}`, skipped?'warn':'success');
}

async function doSavePlanDays(){
  const start=$('pd_start')?.value.trim()||'';
  const end=$('pd_end')?.value.trim()||'';
  const days=Array.from(document.querySelectorAll('#pd_days input:checked')).map(x=>Number(x.dataset.day));
  if(!start||!end) return toast('أدخل تاريخي البداية والنهاية','warn');
  if(start>end) return toast('البداية يجب أن تسبق النهاية','warn');
  if(!days.length) return toast('اختر يوماً واحداً على الأقل','warn');

  const prev = _tData?.planConfig || {};
  const termChanged = String(prev.termStart||'') !== start || String(prev.termEnd||'') !== end || String((prev.workDays||[]).join(',')) !== days.join(',');

  await guard(DS.setSetting('plan_term_start',start),'حفظ…');
  await guard(DS.setSetting('plan_term_end',end),'حفظ…');
  await guard(DS.setSetting('plan_work_days',days.join(',')),'حفظ…');
  if(_tData) _tData.planConfig = { workDays: days, termStart: start, termEnd: end };
  toast('تم حفظ إعدادات الفصل');

  // خطط قائمة + تغيّر الفصل → اعرض خيار إعادة التوليد
  const manualPlans = (_tData?.plans||[]).filter(p => p.Source==='Manual' && p.Type==='conserve');
  if(termChanged && manualPlans.length){
    const count = new Set(manualPlans.map(p => p.Student_ID)).size;
    setTimeout(() => openRegenerateAllPlans(count), 400);
  } else {
    renderPlanDaysTab($('settingsSubBody'));
  }
}

/* إعادة توليد كل خطط الحفظ اليدوية على الفصل الجديد — تُبقي المدى الكلي لكل طالب وتعيد توزيعه على أيام الفصل */
function openRegenerateAllPlans(count){
  openModal('تغيّر الفصل — إعادة توليد الخطط؟', `
    <p class="text-sm text-gray-700 font-bold mb-4 leading-relaxed">تغيّرت تواريخ الفصل. لديك خطط حفظ يدوية لدى <b>${count}</b> طالباً على المدى السابق.<br>هل تريد إعادة توليدها على المدى الجديد؟ (تُحفَظ حالات الأوراد المُنجَزة سابقاً كما هي — يُستبدَل توزيع الأيام المتبقية فقط.)</p>
    <div class="bg-orange-50 border border-orange-200 rounded-xl p-3 text-xs font-bold text-orange-800 mb-4">تُستبدل الأوراد الحالية بأوراد جديدة موزّعة على أيام الفصل الجديد، بنفس المدى القرآني الكلي. المقدار اليومي يُحسَب تلقائياً.</div>
    <div class="grid grid-cols-2 gap-3">
      <button onclick="closeModal();renderPlanDaysTab($('settingsSubBody'))" class="btn bg-gray-100 text-gray-700">لاحقاً</button>
      <button onclick="doRegenerateAllPlans()" class="btn bg-brand-900 text-white shadow-md">نعم، أعد التوليد</button>
    </div>`);
}
async function doRegenerateAllPlans(){
  closeModal();
  const cfg = _tData?.planConfig || {};
  const surs = _tData?.surahs||[], counts = _tData?.surahCounts||[];
  const ord = (sur, ay) => { const i = surs.indexOf(sur); return i<0 ? 0 : counts.slice(0,i).reduce((a,b)=>a+b,0) + Number(ay); };
  const plans = (_tData?.plans||[]).filter(p => p.Source==='Manual' && p.Type==='conserve');
  const byStudent = {};
  plans.forEach(p => { (byStudent[p.Student_ID] = byStudent[p.Student_ID] || []).push(p); });
  const studentIds = Object.keys(byStudent);
  let ok=0, fail=0;
  loader(true,`إعادة التوليد… 0/${studentIds.length}`);
  for(let i=0;i<studentIds.length;i++){
    const sid = studentIds[i];
    loader(true,`إعادة التوليد… ${i+1}/${studentIds.length}`);
    const cur = byStudent[sid].sort((a,b)=>a.Date.localeCompare(b.Date));
    // استنتج النطاقات من الخطة القائمة (نفس منطق تعديل المقدار)
    const ranges = [];
    let curStart = cur[0], curEnd = cur[0];
    for(let j=1;j<cur.length;j++){
      const prevEndOrd = ord(curEnd.To_Surah, curEnd.To_Ayah);
      const thisStartOrd = ord(cur[j].From_Surah, cur[j].From_Ayah);
      if(thisStartOrd === prevEndOrd + 1 || thisStartOrd === prevEndOrd - 1){ curEnd = cur[j]; }
      else { ranges.push({from:curStart,to:curEnd}); curStart = cur[j]; curEnd = cur[j]; }
    }
    ranges.push({from:curStart,to:curEnd});
    const payload = {
      studentId:sid, type:'conserve',
      startDate:cfg.termStart, endDate:cfg.termEnd,
      ranges: ranges.map(r=>({fromSurah:r.from.From_Surah,fromAyah:Number(r.from.From_Ayah)||1,toSurah:r.to.To_Surah,toAyah:Number(r.to.To_Ayah)||1})),
      workDays:cfg.workDays,
      replaceExisting:true
    };
    try{ const r = await DS.planGenerate(payload); if(r&&r.success) ok++; else fail++; }catch(e){ fail++; }
  }
  loader(false);
  toast(`أُعيد توليد ${ok} خطة${fail?` · فشل ${fail}`:''}`);
  await refreshTeacherStudents();
  renderPlanDaysTab($('settingsSubBody'));
}

async function confirmDeleteAuditLog(id, studentName, itemDesc, pts){

    title: 'حذف سجل نقاط',

    confirmText: 'حذف',

/* اقرأ ملف الصورة، صغّرها إلى 256×256 مع الحفاظ على النسبة، وخزّنها base64 */
async function apPickLogo(file){
  if(!file) return;
  if(!file.type.startsWith('image/')) return toast('يجب اختيار ملف صورة','warn');
  if(file.size > 5 * 1024 * 1024) return toast('حجم الصورة يجب أن يكون أقل من 5MB','warn');
  try{
    const dataUrl = await _apResizeImage(file, 256);
    $('ap_logo').value = dataUrl;
    const wrap = $('ap_preview_wrap');
    if(wrap) wrap.innerHTML = `<img src="${dataUrl}" alt="Logo" class="w-full h-full object-contain">`;
    const clr = $('ap_clear_btn'); if(clr) clr.classList.remove('hidden');
    toast('اختيرت الصورة — اضغط «حفظ وتطبيق»','info');
  } catch(e){
    toast(e.message || 'تعذّر معالجة الصورة','error');
  }
}

/* تصغير صورة إلى مربّع max×max مع الحفاظ على النسبة (padding شفاف)، والإخراج PNG */
function _apResizeImage(file, max){
  return new Promise((resolve, reject) => {
    if(file.type === 'image/svg+xml'){
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error('تعذّر قراءة الملف'));
      r.readAsDataURL(file);
      return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = max; canvas.height = max;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, max, max);
      ctx.drawImage(img, (max - w) / 2, (max - h) / 2, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('صيغة الصورة غير مدعومة')); };
    img.src = url;
  });
}

  };

  setSlot('#sidebar', '.brand-logo-slot', '28px');
  setSlot('#loginScreen', '.brand-logo-slot', '40px');

  const sbName = document.querySelector('#sidebar .brand-name-slot');

function renderDbHealthResult(r){
  const box = $('db_health_result'); if(!box) return;
  const iss = r.issues || {};
  const totalIssues = (iss.usersWithoutSd?.length||0) + (iss.sdWithoutUser?.length||0) + (iss.sdInvalidGroup?.length||0) + (iss.duplicates?.length||0) + (iss.parentsWithoutChildren?.length||0);

  const stat = (label, val, color)=>`<div class="bg-white/10 backdrop-blur rounded-xl p-3">
    <div class="text-[11px] font-bold text-white/70">${label}</div>
    <div class="text-xl font-extrabold ${color||'text-white'} tabular-nums">${val}</div>
  </div>`;

  const issList = (title, arr, formatter)=>arr && arr.length ? `
    <details class="bg-white/10 backdrop-blur rounded-xl p-3 mt-2">
      <summary class="cursor-pointer font-bold text-white text-sm">${title} (${arr.length})</summary>
      <div class="mt-2 text-xs text-white/80 font-bold space-y-1 max-h-40 overflow-y-auto">
        ${arr.slice(0,50).map(formatter).join('')}
      </div>
    </details>` : '';

  box.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
      ${stat('المستخدمون', r.counts.users)}
      ${stat('طلاب في Users', r.counts.studentUsers)}
      ${stat('Students_Data', r.counts.studentsData)}
      ${stat('المجموعات', r.counts.groups)}
    </div>
    ${totalIssues===0
      ? `<div class="bg-success/20 border border-success/40 rounded-xl p-3 text-white font-extrabold text-center">قاعدة البيانات سليمة تماماً — لا توجد مشاكل</div>`
      : `<div class="bg-gold-500/20 border border-gold-500/40 rounded-xl p-3 text-gold-100 font-extrabold mb-2">عثرنا على ${totalIssues} مشكلة — انقر "إصلاح تلقائي" لإصلاحها</div>
        ${issList('طلاب في Users بدون Students_Data', iss.usersWithoutSd, x=>`<div>• ${esc(x.name||'—')} (${esc(x.id)})</div>`)}
        ${issList('يتامى في Students_Data بلا Users', iss.sdWithoutUser, x=>`<div>• ${esc(x.id)}</div>`)}
        ${issList('طلاب في مجموعات محذوفة', iss.sdInvalidGroup, x=>`<div>• طالب ${esc(x.id)} — مجموعة ${esc(x.group)}</div>`)}
        ${issList('معرفات مكررة', iss.duplicates, x=>`<div>• ${esc(x.id)} (${x.count} مرات)</div>`)}
        ${issList('أولياء أمور بلا أبناء', iss.parentsWithoutChildren, x=>`<div>• ${esc(x.name||'—')} (${esc(x.id)})</div>`)}
      `}
  `;
}

function renderCalendarInto(id,events,editable){const c=$(id);if(!c)return;const y=_calDate.getFullYear(),m=_calDate.getMonth();const first=new Date(y,m,1),startDow=first.getDay(),days=new Date(y,m+1,0).getDate();const gMonth=new Intl.DateTimeFormat('ar',{month:'long',year:'numeric'}).format(first);const hRange=toHijri(ymd(new Date(y,m,1)))+' — '+toHijri(ymd(new Date(y,m,days)));const evMap={};(events||[]).forEach(e=>{(evMap[e.Date]=evMap[e.Date]||[]).push(e)});const dow=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];let cells='';for(let i=0;i<startDow;i++)cells+='<div></div>';const t=ymd(new Date());for(let day=1;day<=days;day++){const dobj=new Date(y,m,day),ds=ymd(dobj),has=evMap[ds],isT=ds===t;cells+=`<div onclick="${editable?`openAddEvent('${ds}')`:`showDayEvents('${ds}')`}" class="relative bg-white border border-gray-100 rounded-xl p-2 min-h-[70px] cursor-pointer hover:border-brand-500 transition shadow-sm ${isT?'ring-2 ring-gold-500':''} ${has?'bg-brand-50/30':''}"><div class="flex justify-between items-start"><span class="text-sm font-extrabold ${isT?'text-gold-600':'text-gray-900'}">${day}</span><span class="text-[10px] font-bold text-gray-400">${hijriDay(dobj)}</span></div>${has?`<div class="mt-2 space-y-1">${has.slice(0,2).map(e=>`<div class="text-[9px] font-bold bg-brand-900 text-white rounded px-1.5 py-0.5 truncate">${esc(e.Title)}</div>`).join('')}${has.length>2?`<div class="text-[10px] font-bold text-gray-500 text-center bg-gray-100 rounded mt-1">+${has.length-2}</div>`:''}</div>`:''}</div>`}c.innerHTML=`<div class="flex items-center justify-between mb-4 bg-white p-2 rounded-xl shadow-sm border border-gray-100"><button onclick="_calDate.setMonth(_calDate.getMonth()-1);renderCalendarInto('${id}',_calEvents,${editable})" class="w-10 h-10 rounded-lg bg-gray-50 hover:bg-gray-100 font-bold text-gray-600 flex items-center justify-center transition">&lt;</button><div class="text-center"><div class="font-extrabold text-brand-900 text-lg">${gMonth}</div><div class="text-xs font-bold text-gold-600">${hRange}</div></div><button onclick="_calDate.setMonth(_calDate.getMonth()+1);renderCalendarInto('${id}',_calEvents,${editable})" class="w-10 h-10 rounded-lg bg-gray-50 hover:bg-gray-100 font-bold text-gray-600 flex items-center justify-center transition">&gt;</button></div><div class="grid grid-cols-7 gap-2 mb-2">${dow.map(d=>`<div class="text-center text-xs font-extrabold text-gray-500 bg-white py-2 rounded-lg shadow-sm border border-gray-100">${d}</div>`).join('')}</div><div class="grid grid-cols-7 gap-2">${cells}</div>`}
function showDayEvents(ds){const l=_calEvents.filter(e=>e.Date===ds);if(!l.length)return;openModal('فعاليات '+ds,`<p class="text-sm font-bold text-gold-600 mb-4">${toHijri(ds)}</p>`+l.map(e=>`<div class="bg-surface border border-gray-100 rounded-xl p-4 mb-3"><div class="flex items-center gap-2 mb-2"><p class="font-extrabold text-brand-900 text-lg">${esc(e.Title)}</p>${e.Type?`<span class="px-2 py-1 bg-brand-100 text-brand-700 text-xs font-bold rounded">${esc(e.Type)}</span>`:''}</div>${e.Description?`<p class="text-sm font-bold text-gray-600 leading-relaxed">${esc(e.Description)}</p>`:''}</div>`).join(''))}
function openAddEvent(ds){openModal('إضافة فعالية · '+ds,`<p class="text-sm font-bold text-gold-600 mb-6">${toHijri(ds)}</p><div class="space-y-4"><div><label class="block text-sm font-bold text-gray-700 mb-2">عنوان الفعالية</label><input id="ev_title" class="input"></div><div><label class="block text-sm font-bold text-gray-700 mb-2">النوع</label><select id="ev_type" class="input"><option value="اختبار">اختبار</option><option value="فعالية">فعالية</option><option value="برنامج">برنامج</option><option value="عام">عام</option></select></div><div><label class="block text-sm font-bold text-gray-700 mb-2">التفاصيل والوصف</label><textarea id="ev_desc" rows="3" class="input"></textarea><input type="hidden" id="ev_date" value="${esc(ds)}"></div><div class="flex gap-3 pt-2"><button onclick="doAddEvent()" class="btn bg-brand-900 text-white flex-1 shadow-md">إضافة الفعالية</button><button onclick="closeModal()" class="btn bg-gray-100 text-gray-700 flex-1">إلغاء</button></div></div>`)}

async function renderParent(){
  let children, feed;
  loader(true,'تحميل…');
  try{ [children, feed] = await Promise.all([DS.getChildren(currentUser.ID), DS.getFeed('Parent')]); }
  catch(e){ toast('خطأ: '+(e&&e.message||e),'error'); return; }
  finally{ loader(false); }
  if(!Array.isArray(children)){ if(!(children&&children._auth)) toast((children&&children.message)||'تعذّر التحميل','error'); return; }
  feed = (feed&&feed.news)?feed:{news:[],events:[]};
  $('mainNav').innerHTML=`<div class="px-4 py-3 rounded-xl bg-brand-50 text-brand-900 font-bold flex items-center gap-3">${svg('home')} لوحة ولي الأمر</div>`;
  buildMobTabs([], null);
  const opts=children.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  
  $('portal').innerHTML=`<div class="fade-in space-y-6">
    <div class="mb-2">
      <h1 class="text-2xl font-extrabold text-gray-900">أهلًا بك، ${esc(currentUser.Name)}</h1>
      <p class="text-gray-500 mt-1 font-bold">نظام المتابعة الأبوية لحلقة ابن كثير</p>
    </div>
    ${children.length?`<div class="bg-white p-6 rounded-2xl shadow-saas border border-gray-50 max-w-md"><label class="block text-sm font-bold text-gray-700 mb-3">اختر الابن لمتابعة إنجازه:</label><select id="childSel" onchange="loadChild()" class="input font-extrabold text-brand-900 shadow-sm">${opts}</select></div><div id="childView"></div>`:'<div class="bg-white p-12 rounded-3xl shadow-saas border border-gray-50 text-center"><p class="text-gray-400 font-bold text-lg">لا يوجد أبناء مرتبطون بحسابك حالياً.</p></div>'}
    
    <div class="grid lg:grid-cols-2 gap-6 mt-8 border-t border-gray-100 pt-8">
      <div class="bg-white p-6 rounded-3xl shadow-saas border border-gray-50"><h3 class="text-xl font-extrabold text-brand-900 mb-6 flex items-center gap-2">${svg('news','w-6 h-6 text-gold-500')} إعلانات الحلقة</h3><div class="space-y-4 max-h-[480px] overflow-y-auto pr-2">${(feed.news||[]).map(n=>{const isVid=n.Type==='video';return `<div class="bg-surface border border-gray-100 p-5 rounded-2xl"><div class="flex justify-between items-center mb-2">${isVid?`<span class="text-blue-600 ml-1 inline-flex">${svg('video','w-4 h-4')}</span>`:''}<h4 class="font-extrabold text-brand-900 text-lg flex-1">${esc(n.Title)}</h4><span class="text-xs font-bold text-gray-400 shrink-0">${esc(n.Date)}</span></div>${n.Body?`<p class="text-sm font-bold text-gray-600 leading-relaxed whitespace-pre-line">${esc(n.Body)}</p>`:''} ${isVid?ytEmbedHtml(n.Video_URL):''}${isVid?`<button onclick="loadNewsComments(${jsArg(n.News_ID)})" class="mt-2 text-xs font-bold text-brand-700 hover:underline">التعليقات</button><div id="nc_${esc(n.News_ID)}" class="hidden"></div>`:''}</div>`;}).join('')||`<div class="bg-surface p-8 rounded-2xl text-center"><p class="text-gray-400 font-bold">لا توجد إعلانات</p></div>`}</div></div>
      <div class="bg-white p-6 rounded-3xl shadow-saas border border-gray-50 h-fit"><h3 class="text-xl font-extrabold text-brand-900 mb-6 flex items-center gap-2">${svg('calendar','w-6 h-6 text-gold-500')} التقويم الخاص بالحلقة</h3><div id="pCal" class="bg-surface p-4 rounded-2xl border border-gray-100"></div></div>
    </div>
  </div>`;
  _calEvents=feed.events||[];_calDate=new Date();renderCalendarInto('pCal',_calEvents,false);
  if(children.length)loadChild();
}
async function loadChild(){
  const sid=$('childSel').value;const d=await guard(DS.getStudentDashboard(sid),'تحميل بيانات الابن…');if(!d||d.success===false)return;
  const tps=_todayPlans(d); const prog=d.progress||{};
  const posBox=(p,label,cls)=>p&&p.surah?`<div class="rounded-2xl p-4 ${cls}"><div class="text-xs font-bold opacity-80">${label}</div><div class="font-extrabold text-lg mt-1 name-full">${esc(p.surah)}${p.ayah?' <span class="text-sm font-normal">آية '+esc(p.ayah)+'</span>':''}</div></div>`:`<div class="rounded-2xl p-4 bg-gray-50 border border-gray-100 text-gray-400"><div class="text-xs font-bold">${label}</div><div class="text-sm font-bold mt-1">لم يبدأ</div></div>`;

  const badges=(d.badges||[]).map(b=>`<div class="text-center p-3 bg-gold-50 border border-gold-100 rounded-2xl"><div class="text-3xl mb-1">${b.Icon||'🏅'}</div><div class="text-[11px] font-extrabold text-gold-700 name-full">${esc(b.Title)}</div></div>`).join('')||'<div class="col-span-full bg-surface border border-gray-100 p-6 rounded-2xl text-center"><p class="text-gray-400 font-bold text-sm">لا شارات بعد</p></div>';
  const logRows=(d.logs||[]).slice(0,30).map(l=>`<tr class="border-b border-gray-50 hover:bg-gray-50 transition"><td class="p-3 text-xs text-gray-500 font-bold">${esc(l.Date)}</td><td class="p-3 text-sm font-bold text-gray-900 name-full">${esc(l.Description)}</td><td class="p-3"><span class="font-extrabold px-2.5 py-1 rounded-full text-xs ${Number(l.Point_Value)>=0?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${Number(l.Point_Value)>=0?'+':''}${esc(l.Point_Value)}</span></td></tr>`).join('')||'<tr><td colspan="3" class="p-6 text-center text-gray-400 font-bold">لا يوجد سجل نقاط</td></tr>';

  $('childView').innerHTML=`<div class="grid md:grid-cols-5 gap-4 fade-in mt-6">
    <div class="rounded-3xl p-5 bg-brand-900 text-white shadow-saas"><div class="text-xs text-gold-500 font-bold mb-1">النقاط الكلية</div><div class="text-3xl font-extrabold tabular-nums">${d.totalPoints}</div></div>
    <div class="rounded-3xl p-5 bg-success text-white shadow-saas"><div class="text-xs opacity-90 font-bold mb-1">نسبة الإنجاز</div><div class="text-3xl font-extrabold tabular-nums">${d.stats.donePct}%</div></div>
    <div class="rounded-3xl p-5 bg-gold-100 border border-gold-200 text-gold-800 shadow-sm"><div class="text-xs font-bold mb-1">السلسلة</div><div class="text-3xl font-extrabold tabular-nums">${d.stats.streak}</div></div>
    <div class="rounded-3xl p-5 bg-blue-50 border border-blue-100 text-blue-800 shadow-sm"><div class="text-xs font-bold mb-1">أيام الحضور</div><div class="text-3xl font-extrabold tabular-nums">${d.stats.presentDays||0}</div></div>
    <div class="rounded-3xl p-5 bg-purple-50 border border-purple-100 text-purple-800 shadow-sm"><div class="text-xs font-bold mb-1">الشارات</div><div class="text-3xl font-extrabold tabular-nums">${(d.badges||[]).length}</div></div>

    <div class="bg-white p-6 rounded-3xl shadow-saas border border-gray-50 md:col-span-5 mt-2">
      <h3 class="text-xl font-extrabold text-brand-900 mb-5 flex items-center gap-2">${svg('location','w-6 h-6 text-gold-500')} أين وصل الابن في الحفظ؟</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        ${posBox(prog.conserve,'مسار الحفظ','bg-green-50 text-green-900 border border-green-200')}
        ${posBox(prog.revision,'مسار المراجعة','bg-blue-50 text-blue-900 border border-blue-200')}
        ${posBox(prog.mastery,'مسار الإتقان','bg-gold-50 text-gold-900 border border-gold-200')}
      </div>
    </div>

    <div class="bg-white p-6 rounded-3xl shadow-saas border border-gray-50 md:col-span-5">
      <div class="flex items-center justify-between flex-wrap gap-4">
        <h3 class="text-xl font-extrabold text-brand-900 flex items-center gap-2">${svg('book','w-6 h-6 text-gold-500')} خطة وحفظ اليوم</h3>
        ${tps.length?`<div class="flex-1 min-w-[240px]">${todayPlansList(tps)}</div>`:'<div class="bg-surface p-4 rounded-xl border border-gray-100"><p class="text-gray-400 font-bold">لا توجد خطة مقررة اليوم</p></div>'}
      </div>
    </div>

    <div class="bg-white p-6 rounded-3xl shadow-saas border border-gray-50 md:col-span-2">
      <h3 class="text-lg font-extrabold text-brand-900 mb-4 flex items-center gap-2">${svg('trophy','w-5 h-5 text-gold-500')} الشارات المكتسبة</h3>
      <div class="grid grid-cols-2 gap-3">${badges}</div>
    </div>

    <div class="bg-white p-6 rounded-3xl shadow-saas border border-gray-50 md:col-span-3">
      <h3 class="text-lg font-extrabold text-brand-900 mb-4 flex items-center gap-2">${svg('history','w-5 h-5 text-gold-500')} سجل النقاط الأخير</h3>
      <div class="max-h-[280px] overflow-y-auto border border-gray-100 rounded-2xl"><table class="w-full text-right"><thead class="sticky top-0 bg-surface border-b border-gray-100 text-gray-500 text-xs font-bold"><tr><th class="p-3">التاريخ</th><th class="p-3">البند</th><th class="p-3">النقاط</th></tr></thead><tbody>${logRows}</tbody></table></div>
    </div>

    <div class="bg-white p-6 rounded-3xl shadow-saas border border-gray-50 md:col-span-5">
      <h3 class="text-lg font-extrabold text-brand-900 mb-4 flex items-center gap-2">${svg('calendar','w-5 h-5 text-gold-500')} سجل حضور الابن</h3>
      <div class="max-h-[360px] overflow-y-auto border border-gray-100 rounded-2xl"><table class="w-full text-right"><thead class="sticky top-0 bg-surface border-b border-gray-100 text-gray-500 text-xs font-bold"><tr><th class="p-3">التاريخ</th><th class="p-3">الحالة</th></tr></thead><tbody>${(d.attendanceHistory||[]).slice(0,40).map(a=>`<tr class="border-b border-gray-50"><td class="p-3 text-xs text-gray-500 font-bold whitespace-nowrap">${esc(a.Date)}</td><td class="p-3"><span class="px-2 py-1 rounded-full text-[11px] font-bold ${a.Status==='Present'?'bg-green-100 text-green-700':a.Status==='Late'?'bg-gold-100 text-gold-700':'bg-red-100 text-red-700'}">${a.Status==='Present'?'حاضر':a.Status==='Late'?'متأخر':'غائب'}</span></td></tr>`).join('')||'<tr><td colspan="2" class="p-6 text-center text-gray-400 font-bold">لا سجل</td></tr>'}</tbody></table></div>
    </div>
  </div>`;
}
